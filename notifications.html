<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — MBS</title><link rel="stylesheet" href="style.css"><style>.notice-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:17px;border-bottom:1px solid #e8eaf1}.unread{background:#f1f5ff}.notice-row h3{margin:0 0 7px}.notice-row p{margin:0;color:#687089;line-height:1.5}.tag{font-size:11px;font-weight:800;border-radius:20px;padding:5px 8px;background:#e5e7eb}</style></head><body><header class="top"><nav class="nav"><a class="brand" href="index.html"><span class="logo">M</span>MBS</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="services.html">Services</a><a href="#" id="logout">Logout</a></div></nav></header><main class="container"><div class="section-title"><h2>🔔 Notifications Centre</h2><p class="muted">Account updates, MPS transfer alerts and service request messages.</p></div><div class="card"><div class="actions"><button class="btn btn-blue" id="markAll">Mark all as read</button><button class="btn" id="refresh">Refresh</button></div><div id="noticeList"><div class="notice">Loading notifications…</div></div></div></main><footer class="footer">MBS — Mats Banks<br><span class="small">Educational/demo system. Notifications are not official bank alerts.</span></footer><script type="module">import{db,collection,getDocs,query,where,doc,updateDoc}from'./firebase.js';import{getUser,logout,esc}from'./app.js';const u=getUser();if(!u)location.href='login.html';document.getElementById('logout').onclick=e=>{e.preventDefault();logout()};let records=[];document.getElementById('refresh').onclick=load;document.getElementById('markAll').onclick=async()=>{for(const n of records.filter(x=>!x.read)){try{await updateDoc(doc(db,'notifications',n.id),{read:true})}catch(e){}}load()};async function load(){const el=document.getElementById('noticeList');try{const s=await getDocs(query(collection(db,'notifications'),where('accountId','==',u.id)));records=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));el.innerHTML=records.map(n=>`<div class="notice-row ${n.read?'':'unread'}"><div><h3>${esc(n.title||'MBS notification')} ${n.read?'':'<span class="tag">NEW</span>'}</h3><p>${esc(n.message||'')}</p><small class="muted">${n.createdAt?.toDate?n.createdAt.toDate().toLocaleString():'Just now'}</small></div>${n.read?'':'<button class="btn" data-id="'+n.id+'">Mark read</button>'}</div>`).join('')||'<div class="notice">You are all caught up. No notifications yet.</div>';el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'notifications',b.dataset.id),{read:true});load()})}catch(e){el.innerHTML='<div class="notice danger">Could not load notifications. Check Firestore permissions.</div>'}}load();</script></body></html>

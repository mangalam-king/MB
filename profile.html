<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — MBS</title><link rel="stylesheet" href="style.css"><style>.profile-hero{background:linear-gradient(135deg,#321b72,#5131a3 55%,#2399e8);color:#fff;border-radius:24px;padding:28px;display:flex;align-items:center;gap:20px;margin-bottom:22px;box-shadow:0 14px 35px #24315b20}.avatar{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#f6c453,#fff);color:#392070;display:grid;place-items:center;font-size:28px;font-weight:900;flex:none}.profile-hero h2{margin:0 0 6px}.profile-hero p{margin:0;opacity:.85}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.info-item{padding:16px;border:1px solid #e5e8f2;border-radius:15px;background:#fafbff}.info-item span{display:block;color:#687089;font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.4px;margin-bottom:6px}.info-item strong{font-size:16px;word-break:break-word}.back-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}@media(max-width:700px){.info-grid{grid-template-columns:1fr}.profile-hero{align-items:flex-start}}</style></head><body><header class="top"><nav class="nav"><a class="brand" href="index.html"><span class="logo">M</span>MBS</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a><a href="account-info.html">Account Info</a><a href="#" id="logout">Logout</a></div></nav></header><main class="container"><div id="app"></div></main><footer class="footer">MBS — Mats Banks · Educational/demo banking system<br><span class="small">Not a real bank or payment service.</span></footer><script type="module">import {getUser,logout,esc,money} from './app.js';import {db,doc,getDoc} from './firebase.js';const root=document.getElementById('app');document.getElementById('logout').onclick=e=>{e.preventDefault();logout()};let u=getUser();if(!u)location.href='login.html';else load();async function load(){try{const s=await getDoc(doc(db,'accounts',u.id));if(!s.exists())throw new Error('ACCOUNT');u={id:s.id,...s.data()};localStorage.setItem('mbsUser',JSON.stringify(u));render()}catch(e){localStorage.removeItem('mbsUser');location.href='login.html'}}function val(v){return v===undefined||v===null||v===''?'—':esc(v)}function initials(name){return String(name||'MBS').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'M'}function render(){root.innerHTML=`<div class="back-row"><a class="btn" href="dashboard.html">← Dashboard</a><a class="btn btn-blue" href="account-info.html">🏦 Account Information</a></div><div class="profile-hero"><div class="avatar">${initials(u.name)}</div><div><h2>${val(u.name)}</h2><p>Customer Profile · MATS Number ${val(u.matsNumber)}</p></div></div><div class="card"><h3>👤 Personal Information</h3><p class="muted">Your personal details currently stored with MBS.</p><div class="info-grid"><div class="info-item"><span>Full Name</span><strong>${val(u.name)}</strong></div><div class="info-item"><span>Date of Birth</span><strong>${val(u.dob)}</strong></div><div class="info-item"><span>Mobile Number</span><strong>${val(u.mobile)}</strong></div><div class="info-item"><span>Email</span><strong>${val(u.email)}</strong></div><div class="info-item"><span>Guardian</span><strong>${val(u.guardian)}</strong></div><div class="info-item"><span>Address</span><strong>${val(u.address)}</strong></div></div></div><br><div class="card"><h3>🔐 Login & Security</h3><div class="info-grid"><div class="info-item"><span>MATS Number</span><strong>${val(u.matsNumber)}</strong></div><div class="info-item"><span>MPIN</span><strong>${u.mpinHash?'Set':'Not set'}</strong></div><div class="info-item"><span>Account Status</span><strong>${val(u.status)}</strong></div><div class="info-item"><span>Profile Type</span><strong>${u.accountType==='Minor Savings'?'Minor Savings Customer':'Savings Customer'}</strong></div></div><div class="actions" style="margin-top:18px"><a class="btn btn-blue" href="dashboard.html">Change MPIN from Dashboard</a></div></div>`}</script></body></html>

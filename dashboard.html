<script type="module">
import {getUser,logout,money,esc} from "./app.js";
import {db,doc,getDoc,collection,getDocs,query,where,runTransaction,serverTimestamp,updateDoc,addDoc,setDoc,deleteDoc} from "./firebase.js";
const appEl=document.getElementById("app"),logoutLink=document.getElementById("logout"); let u=getUser(); if(!u) location.href="login.html"; else load();
async function load(){const snap=await getDoc(doc(db,"accounts",u.id));if(!snap.exists()){localStorage.removeItem("mbsUser");location.href="login.html";return}u={id:snap.id,...snap.data()};localStorage.setItem("mbsUser",JSON.stringify(u));render();await loadHistory()}
function render(){
 const vc=u.virtualCard||{};
 appEl.innerHTML=`
 <div class="account-preview"><span class="pill">MBS DIGITAL BANKING</span><h2>Welcome back, ${esc(u.name)}</h2><div class="account-no">${esc(u.accountNumber)}</div><p>MATS Number: <b>${esc(u.matsNumber)}</b> · Account status: <b>${esc(u.status||"—")}</b></p><h3>Available Balance: ${money(u.balance)}</h3><p class="small">Your money overview, MPS transfers and account services in one place.</p></div><div class="premium-grid"><div class="premium-tile"><span class="muted">Available balance</span><strong>${money(u.balance)}</strong></div><div class="premium-tile"><span class="muted">Transactions</span><strong id="statCount">—</strong></div><div class="premium-tile"><span class="muted">Money received</span><strong id="statIn">₹0.00</strong></div><div class="premium-tile"><span class="muted">Money sent</span><strong id="statOut">₹0.00</strong></div></div><div class="feature-links"><a href="notifications.html">🔔 Notifications</a><a href="services.html">🧾 Account services</a><a href="#beneficiaryCard">👥 Beneficiaries</a><a href="#scheduledCard">🗓️ Scheduled transfers</a><a href="#historyCard">📊 Transactions & receipts</a></div>
 <div class="actions" style="margin:-8px 0 22px"><a class="btn btn-blue" href="profile.html">👤 Profile</a><a class="btn" href="account-info.html">🏦 Account Information</a></div>
 <div class="grid">
  <div class="card"><h3>💸 Send Money</h3><p class="muted">Enter the receiver, amount and note. You will get a confirmation screen before the transfer.</p>
   <div class="field"><label>Saved beneficiary</label><select id="savedBeneficiary"><option value="">Choose saved beneficiary (optional)</option></select></div><div class="field"><label>Receiver MATS Number</label><input id="receiver" maxlength="4" inputmode="numeric" placeholder="e.g. 4821"></div>
   <div class="field"><label>Amount (₹)</label><input id="sendAmount" type="number" min="1" max="10000" step="0.01" placeholder="₹"><small class="muted">Demo limit: ₹10,000 per transfer.</small></div>
   <div class="field"><label>Note (optional)</label><input id="note" maxlength="80" placeholder="Payment note"></div>
   <button class="btn btn-blue" id="continueSend">Continue</button><div id="sendMsg"></div><div id="confirmBox" class="confirm-box hidden"></div>
  </div>
  <div class="card"><h3>💳 MBS Virtual Card</h3>${vc.number?`<div class="card-visual"><div class="cv-top"><b>MBS</b><span>VIRTUAL CARD</span></div><div class="card-number">${esc(vc.number)}</div><div class="cv-bottom"><div><div class="cv-small">Card Holder</div><b>${esc(vc.name||u.name)}</b></div><div><div class="cv-small">Expiry</div><b>${esc(vc.expiry||"—")}</b></div><div><div class="cv-small">CVV</div><b>${esc(vc.cvv||"—")}</b></div></div></div>`:`<div class="notice">Your virtual card details have not been issued by the admin yet.</div>`}</div>
 </div>
 <br><div class="grid"><div class="card" id="beneficiaryCard"><h3>👥 Beneficiary Management</h3><p class="muted">Save frequently used MATS Numbers for faster transfers.</p><div class="field"><label>Beneficiary name</label><input id="benName" maxlength="60" placeholder="Name"></div><div class="field"><label>4-digit MATS Number</label><input id="benMats" maxlength="4" inputmode="numeric" placeholder="1234"></div><button class="btn btn-blue" id="saveBeneficiary">Save beneficiary</button><div id="benMsg"></div><div id="beneficiaryList" class="small"></div></div><div class="card" id="scheduledCard"><h3>🗓️ Scheduled / recurring transfer</h3><p class="muted">Creates a schedule request in this demo. It does not automatically move money in the background.</p><div class="field"><label>Receiver MATS Number</label><input id="schedMats" maxlength="4" inputmode="numeric"></div><div class="field"><label>Amount (₹)</label><input id="schedAmount" type="number" min="1" max="10000" step="0.01"></div><div class="field"><label>First transfer date</label><input id="schedDate" type="date"></div><div class="field"><label>Repeat</label><select id="schedRepeat"><option value="once">One time</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div><button class="btn btn-blue" id="saveSchedule">Create schedule request</button><div id="schedMsg"></div><div id="scheduleList" class="small"></div></div></div>
 <br><div class="grid">
  <div class="card"><h3>🔐 Change MPIN</h3><p class="muted">Verify your current MPIN and set a new 4-digit MPIN.</p><div class="field"><label>Current MPIN</label><input id="oldMpin" type="password" maxlength="4" inputmode="numeric"></div><div class="field"><label>New MPIN</label><input id="newMpin" type="password" maxlength="4" inputmode="numeric"></div><div class="field"><label>Confirm New MPIN</label><input id="confirmMpin" type="password" maxlength="4" inputmode="numeric"></div><button class="btn btn-blue" id="changeMpin">Change MPIN</button><div id="mpinMsg"></div></div>
  <div class="card"><h3>📄 Account Statement</h3><p class="muted">Generate a proper PDF statement containing your account details and transaction history.</p><button class="btn btn-blue" id="downloadPdf">Download PDF Statement</button><div id="statementMsg"></div></div>
 </div>
 <br><div class="card" id="historyCard"><h3>Transaction History & Receipts</h3><div class="two"><div class="field"><label>Search</label><input id="txSearch" placeholder="ID, type, note or MATS number"></div><div class="field"><label>Transaction type</label><select id="txType"><option value="all">All transactions</option><option value="Transfer">Transfers</option><option value="Admin Adjustment">Admin adjustments</option></select></div></div><div class="actions"><button class="btn btn-blue" id="exportTransactions">Download transaction CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Transaction ID</th><th>Type</th><th>Details</th><th>Amount</th><th>Receipt</th></tr></thead><tbody id="history"></tbody></table></div></div>`;
 document.getElementById("continueSend").onclick=prepareTransfer;document.getElementById("changeMpin").onclick=changeMPIN;document.getElementById("downloadPdf").onclick=downloadPDF;document.getElementById("saveBeneficiary").onclick=saveBeneficiary;document.getElementById("saveSchedule").onclick=saveSchedule;document.getElementById("savedBeneficiary").onchange=e=>{if(e.target.value)document.getElementById("receiver").value=e.target.value};document.getElementById("txSearch").oninput=renderHistory;document.getElementById("txType").onchange=renderHistory;document.getElementById("exportTransactions").onclick=exportCSV;logoutLink.onclick=e=>{e.preventDefault();logout()};loadBeneficiaries();loadSchedules();
}
function validPin(v){return /^\d{4}$/.test(v)}
async function hashMPIN(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function prepareTransfer(){
 const mats=document.getElementById("receiver").value.trim(),amount=Math.round(Number(document.getElementById("sendAmount").value)*100)/100,memo=document.getElementById("note").value.trim(),box=document.getElementById("confirmBox"),msg=document.getElementById("sendMsg");
 if(!/^\d{4}$/.test(mats)){msg.innerHTML='<div class="notice danger">Enter a valid 4-digit receiver MATS Number.</div>';return}if(!Number.isFinite(amount)||amount<=0){msg.innerHTML='<div class="notice danger">Enter a valid amount greater than ₹0.</div>';return}if(amount>10000){msg.innerHTML='<div class="notice danger">Demo transfer limit is ₹10,000 per transaction.</div>';return}if(amount>Number(u.balance||0)){msg.innerHTML='<div class="notice danger">Insufficient balance.</div>';return}if(mats===String(u.matsNumber)){msg.innerHTML='<div class="notice danger">You cannot send money to your own account.</div>';return}
 try{msg.innerHTML='<div class="notice">Finding receiver…</div>';const rs=await getDocs(query(collection(db,"accounts"),where("matsNumber","==",mats)));if(rs.empty)throw new Error("RECEIVER_NOT_FOUND");if(rs.size>1)throw new Error("DUPLICATE_MATS");const r=rs.docs[0].data();if(r.status!=="Approved")throw new Error("RECEIVER_NOT_APPROVED");
 box.classList.remove("hidden");box.innerHTML=`<h4>Confirm Transfer</h4><p>Send <b>${money(amount)}</b> to <b>${esc(r.name||"Customer")}</b> (MATS ${esc(mats)})?</p>${memo?`<p>Note: ${esc(memo)}</p>`:""}<div class="buttons"><button class="btn btn-blue" id="confirmTransfer">Confirm & Send</button><button class="btn" id="cancelTransfer">Cancel</button></div>`;document.getElementById("cancelTransfer").onclick=()=>box.classList.add("hidden");document.getElementById("confirmTransfer").onclick=()=>sendMoney(mats,amount,memo,box);
 }catch(e){const map={RECEIVER_NOT_FOUND:"Receiver account was not found.",DUPLICATE_MATS:"This MATS Number is duplicated.",RECEIVER_NOT_APPROVED:"Receiver account is not approved yet."};msg.innerHTML='<div class="notice danger">'+(map[e.message]||"Could not prepare transfer.")+'</div>'}
}
function makeTransactionId(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `MPS${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${Math.floor(1000+Math.random()*9000)}`}
async function sendMoney(mats,amount,memo,box){const msg=document.getElementById("sendMsg"),btn=document.getElementById("confirmTransfer");btn.disabled=true;btn.textContent="Processing…";try{const rs=await getDocs(query(collection(db,"accounts"),where("matsNumber","==",mats)));if(rs.empty)throw new Error("RECEIVER_NOT_FOUND");const receiverId=rs.docs[0].id;const transactionId=makeTransactionId();await runTransaction(db,async tx=>{const senderRef=doc(db,"accounts",u.id),receiverRef=doc(db,"accounts",receiverId),ss=await tx.get(senderRef),rsnap=await tx.get(receiverRef);if(!ss.exists()||!rsnap.exists())throw new Error("ACCOUNT_MISSING");const sender=ss.data(),receiver=rsnap.data(),sb=Number(sender.balance||0),rb=Number(receiver.balance||0);if(sender.status!=="Approved"||receiver.status!=="Approved")throw new Error("NOT_APPROVED");if(sb<amount)throw new Error("INSUFFICIENT");tx.update(senderRef,{balance:sb-amount});tx.update(receiverRef,{balance:rb+amount});tx.set(doc(collection(db,"transactions")),{transactionId,type:"Transfer",status:"Successful",referenceNumber:transactionId,fromAccountId:u.id,fromMatsNumber:String(sender.matsNumber),fromName:String(sender.name),toAccountId:receiverId,toMatsNumber:String(receiver.matsNumber),toName:String(receiver.name),amount,note:memo,createdAt:serverTimestamp()});tx.set(doc(collection(db,"notifications")),{accountId:u.id,title:"Transfer successful",message:`You sent ₹${amount.toFixed(2)} to MATS ${mats}. Ref: ${transactionId}`,type:"transaction",read:false,createdAt:serverTimestamp()});tx.set(doc(collection(db,"notifications")),{accountId:receiverId,title:"Money received",message:`You received ₹${amount.toFixed(2)} from MATS ${sender.matsNumber}. Ref: ${transactionId}`,type:"transaction",read:false,createdAt:serverTimestamp()})});msg.innerHTML=`<div class="notice success">${money(amount)} sent successfully.<br>Transaction ID: <b>${transactionId}</b></div>`;box.classList.add("hidden");document.getElementById("receiver").value="";document.getElementById("sendAmount").value="";document.getElementById("note").value="";await load()}catch(e){const map={INSUFFICIENT:"Insufficient balance.",NOT_APPROVED:"Account is not approved.",ACCOUNT_MISSING:"Account could not be found.","permission-denied":"Firebase permission denied."};msg.innerHTML='<div class="notice danger">'+(map[e.code]||map[e.message]||"Transfer failed. Please try again.")+'</div>';btn.disabled=false;btn.textContent="Confirm & Send"}}
async function changeMPIN(){const old=document.getElementById("oldMpin").value,newP=document.getElementById("newMpin").value,conf=document.getElementById("confirmMpin").value,msg=document.getElementById("mpinMsg");if(!validPin(old)||!validPin(newP)||!validPin(conf)){msg.innerHTML='<div class="notice danger">All MPINs must be exactly 4 digits.</div>';return}if(newP!==conf){msg.innerHTML='<div class="notice danger">New MPINs do not match.</div>';return}try{if(await hashMPIN(old)!==u.mpinHash)throw new Error("WRONG");const mpinHash=await hashMPIN(newP);await updateDoc(doc(db,"accounts",u.id),{mpinHash,mpinSetAt:new Date()});u.mpinHash=mpinHash;localStorage.setItem("mbsUser",JSON.stringify(u));msg.innerHTML='<div class="notice success">MPIN changed successfully.</div>';document.getElementById("oldMpin").value="";document.getElementById("newMpin").value="";document.getElementById("confirmMpin").value=""}catch(e){msg.innerHTML='<div class="notice danger">'+(e.message==="WRONG"?"Current MPIN is incorrect.":"Could not change MPIN.")+'</div>'}}
let currentTransactions=[];
async function loadHistory(){try{const s=await getDocs(collection(db,"transactions"));currentTransactions=s.docs.map(x=>({id:x.id,...x.data()})).filter(t=>t.accountId===u.id||t.fromAccountId===u.id||t.toAccountId===u.id).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderHistory();const incoming=currentTransactions.filter(t=>t.toAccountId===u.id).reduce((a,t)=>a+Number(t.amount||0),0),outgoing=currentTransactions.filter(t=>t.fromAccountId===u.id).reduce((a,t)=>a+Number(t.amount||0),0);document.getElementById("statCount").textContent=currentTransactions.length;document.getElementById("statIn").textContent=money(incoming);document.getElementById("statOut").textContent=money(outgoing)}catch(e){document.getElementById("history").innerHTML='<tr><td colspan="6">Transaction history unavailable.</td></tr>'}}
function renderHistory(){const el=document.getElementById("history");if(!el)return;const q=(document.getElementById("txSearch")?.value||"").toLowerCase(),typ=document.getElementById("txType")?.value||"all";const rows=currentTransactions.filter(t=>(typ==="all"||t.type===typ)&&[t.transactionId,t.type,t.note,t.reason,t.fromMatsNumber,t.toMatsNumber,t.status].join(" ").toLowerCase().includes(q));el.innerHTML=rows.map(t=>{const out=t.type==="Transfer"&&t.fromAccountId===u.id,inc=t.type==="Transfer"&&t.toAccountId===u.id,label=out?"Sent to "+esc(t.toMatsNumber):inc?"Received from "+esc(t.fromMatsNumber):t.type==="Admin Adjustment"?"Admin balance adjustment":"Transaction",sign=out?"−":inc?"+":t.type==="Admin Adjustment"?(Number(t.amount||0)>=0?"+":"−"):"";return `<tr><td>${t.createdAt?.toDate?t.createdAt.toDate().toLocaleString():"Just now"}</td><td class="small">${esc(t.transactionId||t.id)}<br><span class="pill">${esc(t.status||"Recorded")}</span></td><td>${esc(t.type||"Transaction")}</td><td>${label}${t.note?" · "+esc(t.note):t.reason?" · "+esc(t.reason):""}</td><td><b>${sign}${money(Math.abs(Number(t.amount||0)))}</b></td><td><button class="btn" onclick="window.mbsReceipt('${esc(t.transactionId||t.id)}')">PDF</button></td></tr>`}).join("")||'<tr><td colspan="6">No matching transactions.</td></tr>'}
window.mbsReceipt=(id)=>{const t=currentTransactions.find(x=>(x.transactionId||x.id)===id);if(!t)return;const lines=['MBS - MPS TRANSACTION RECEIPT','Educational / demo transaction','',`Reference: ${t.transactionId||t.id}`,`Status: ${t.status||'Recorded'}`,`Type: ${t.type||'Transaction'}`,`From: ${t.fromName||u.name||''} (MATS ${t.fromMatsNumber||u.matsNumber||''})`,`To: ${t.toName||''} (MATS ${t.toMatsNumber||''})`,`Amount: ${money(t.amount)}`,`Note: ${t.note||t.reason||'-'}`,`Date: ${t.createdAt?.toDate?t.createdAt.toDate().toLocaleString():'Just now'}`,'','This is a demo receipt, not proof of a real bank payment.'];const blob=buildSimplePDF(lines),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`MBS-Receipt-${id}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
function exportCSV(){const rows=[['Date','Transaction ID','Type','Details','Amount','Status'],...currentTransactions.map(t=>[t.createdAt?.toDate?t.createdAt.toDate().toLocaleString():'Just now',t.transactionId||t.id,t.type||'',t.note||t.reason||'',t.amount||0,t.status||'Recorded'])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`MBS-Transactions-${u.matsNumber}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function saveBeneficiary(){const name=document.getElementById('benName').value.trim(),mats=document.getElementById('benMats').value.trim(),msg=document.getElementById('benMsg');if(!name||!/^[0-9]{4}$/.test(mats)||mats===String(u.matsNumber)){msg.innerHTML='<div class="notice danger">Enter a name and a valid different 4-digit MATS Number.</div>';return}try{const s=await getDocs(query(collection(db,'beneficiaries'),where('ownerId','==',u.id)));if(s.docs.some(d=>String(d.data().matsNumber)===mats))throw new Error('Already saved');await setDoc(doc(collection(db,'beneficiaries')), {ownerId:u.id,name,matsNumber:mats,createdAt:serverTimestamp()});document.getElementById('benName').value='';document.getElementById('benMats').value='';msg.innerHTML='<div class="notice success">Beneficiary saved.</div>';loadBeneficiaries()}catch(e){msg.innerHTML='<div class="notice danger">'+esc(e.message||'Could not save beneficiary.')+'</div>'}}
async function loadBeneficiaries(){try{const s=await getDocs(query(collection(db,'beneficiaries'),where('ownerId','==',u.id)));const list=s.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('savedBeneficiary').innerHTML='<option value="">Choose saved beneficiary (optional)</option>'+list.map(b=>`<option value="${esc(b.matsNumber)}">${esc(b.name)} — ${esc(b.matsNumber)}</option>`).join('');document.getElementById('beneficiaryList').innerHTML=list.map(b=>`<div class="notice">${esc(b.name)} · MATS ${esc(b.matsNumber)} <button class="btn" onclick="window.removeBeneficiary('${b.id}')">Remove</button></div>`).join('')||'<p>No beneficiaries saved yet.</p>'}catch(e){}}
window.removeBeneficiary=async id=>{try{await deleteDoc(doc(db,'beneficiaries',id));loadBeneficiaries()}catch(e){alert('Could not remove beneficiary')}};
async function saveSchedule(){const mats=document.getElementById('schedMats').value.trim(),amount=Number(document.getElementById('schedAmount').value),date=document.getElementById('schedDate').value,repeat=document.getElementById('schedRepeat').value,msg=document.getElementById('schedMsg');if(!/^\d{4}$/.test(mats)||mats===String(u.matsNumber)||!Number.isFinite(amount)||amount<=0||amount>10000||!date||date<new Date().toISOString().slice(0,10)){msg.innerHTML='<div class="notice danger">Enter a valid recipient, amount (up to ₹10,000) and future date.</div>';return}try{await setDoc(doc(collection(db,'scheduledTransfers')),{ownerId:u.id,fromMatsNumber:String(u.matsNumber),toMatsNumber:mats,amount,date,repeat,status:'Requested',createdAt:serverTimestamp()});await setDoc(doc(collection(db,'notifications')),{accountId:u.id,title:'Transfer schedule created',message:`Your ${repeat} transfer request to MATS ${mats} for ₹${amount.toFixed(2)} was saved.`,type:'service',read:false,createdAt:serverTimestamp()});msg.innerHTML='<div class="notice success">Schedule request saved. Demo schedules do not execute automatically.</div>';loadSchedules()}catch(e){msg.innerHTML='<div class="notice danger">Could not save schedule.</div>'}}
async function loadSchedules(){try{const s=await getDocs(query(collection(db,'scheduledTransfers'),where('ownerId','==',u.id)));document.getElementById('scheduleList').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="notice">${esc(x.date)} · ₹${Number(x.amount).toFixed(2)} to MATS ${esc(x.toMatsNumber)} · ${esc(x.repeat)} · ${esc(x.status)} <button class="btn" onclick="window.cancelSchedule('${d.id}')">Cancel</button></div>`}).join('')||'<p>No scheduled transfers.</p>'}catch(e){}}
window.cancelSchedule=async id=>{try{await updateDoc(doc(db,'scheduledTransfers',id),{status:'Cancelled'});loadSchedules()}catch(e){alert('Could not cancel request')}};
function pdfEscape(v){return String(v??"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g," ")}
function buildSimplePDF(lines){
 const pageH=792,pageW=612,margin=40,lineH=14,maxLines=50,pages=[];
 for(let i=0;i<lines.length;i+=maxLines)pages.push(lines.slice(i,i+maxLines));
 const objs=[]; const add=x=>{objs.push(x);return objs.length};
 const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
 const pageIds=[]; const contentIds=[];
 pages.forEach(pg=>{let content='BT /F1 10 Tf '+margin+' '+(pageH-margin)+' Td ';pg.forEach((line,idx)=>{if(idx)content+='0 -'+lineH+' Td ';content+='('+pdfEscape(line.slice(0,105))+') Tj ';});content+='ET';const cid=add(`<< /Length ${content.length} >>\\nstream\\n${content}\\nendstream`);contentIds.push(cid);pageIds.push(0)});
 const pagesId=add(''); const pageObjs=[]; pages.forEach((_,i)=>{pageObjs.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${contentIds[i]} 0 R >>`))});
 objs[pagesId-1]=`<< /Type /Pages /Kids [${pageObjs.map(x=>x+' 0 R').join(' ')}] /Count ${pageObjs.length} >>`;
 const catalog=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
 let pdf='%PDF-1.4\n',offsets=[0]; for(let i=0;i<objs.length;i++){offsets[i+1]=pdf.length;pdf+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'} const xref=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<=objs.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([pdf],{type:'application/pdf'});
}
async function downloadPDF(){const msg=document.getElementById("statementMsg");try{if(!currentTransactions.length)await loadHistory();const lines=[];lines.push('MBS - ACCOUNT STATEMENT','Educational / demo statement','',`Customer: ${u.name||''}`,`Account Number: ${u.accountNumber||''}`,`MATS Number: ${u.matsNumber||''}`,`Current Balance: ${money(u.balance)}`,'','Date | Transaction ID | Type | Details | Amount','--------------------------------------------------------------------------------');currentTransactions.forEach(t=>{const date=t.createdAt?.toDate?t.createdAt.toDate().toLocaleString():'Just now';const details=t.type==='Transfer'?(t.fromAccountId===u.id?'Sent to ':'Received from ')+(t.toMatsNumber||t.fromMatsNumber||''):t.reason||t.type||'';const sign=t.fromAccountId===u.id?'−':t.toAccountId===u.id?'+':Number(t.amount||0)>=0?'+':'−';lines.push(`${date} | ${t.transactionId||t.id} | ${t.type||''} | ${details} | ${sign}${money(Math.abs(Number(t.amount||0)))}`);});const blob=buildSimplePDF(lines),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`MBS-Statement-${u.matsNumber}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);msg.innerHTML='<div class="notice success">PDF statement downloaded successfully.</div>'}catch(e){console.error(e);msg.innerHTML='<div class="notice danger">Could not create PDF statement: '+esc(e?.message||'Unknown error')+'</div>'}}
</script></body></html>

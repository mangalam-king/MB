<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPS Payments — MBS</title><link rel="stylesheet" href="style.css">
<style>
.confirm-box,.card-visual{margin-top:14px;padding:16px;border-radius:16px;border:1px solid rgba(106,50,84,.15);background:linear-gradient(135deg,#fff,#f5f3ff)}
.card-visual{background:linear-gradient(135deg,#6a3254,#4e82c4);color:#fff;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 28px rgba(0,0,0,.14)}
.card-visual .cv-top,.card-visual .cv-bottom{display:flex;justify-content:space-between;gap:12px}.card-number{font-size:23px;letter-spacing:3px}.cv-small{font-size:11px;opacity:.85;text-transform:uppercase}.hidden{display:none!important}
</style></head><body>
<header class="top"><nav class="nav"><a class="brand" href="index.html"><span class="logo">M</span>MBS</a><div class="navlinks"><a href="index.html">Home</a><a href="profile.html">Profile</a><a href="account-info.html">Account Info</a><a href="#" id="logout">Logout</a></div></nav></header>
<main class="container"><div id="app"></div></main><footer class="footer">MBS — Mats Banks · MPS Payment System<br><span class="small">Educational/demo payment system. Not a real payment service.</span></footer>
<script type="module">
import {getUser,logout,money,esc} from "./app.js";
import {db,doc,getDoc,collection,getDocs,query,where,runTransaction,serverTimestamp,updateDoc} from "./firebase.js";
const appEl=document.getElementById("app"),logoutLink=document.getElementById("logout"); let u=getUser(); if(!u) location.href="login.html"; else load();
async function load(){const snap=await getDoc(doc(db,"accounts",u.id));if(!snap.exists()){localStorage.removeItem("mbsUser");location.href="login.html";return}u={id:snap.id,...snap.data()};localStorage.setItem("mbsUser",JSON.stringify(u));render();await loadHistory()}
function render(){
 const vc=u.virtualCard||{};
 appEl.innerHTML=`
 <div class="account-preview"><span class="pill">MPS WALLET</span><h2>${esc(u.name)}</h2><div class="account-no">${esc(u.accountNumber)}</div><p>MATS Number: <b>${esc(u.matsNumber)}</b></p><h3>Available Balance: ${money(u.balance)}</h3></div>
 <div class="actions" style="margin:-8px 0 22px"><a class="btn btn-blue" href="profile.html">👤 Profile</a><a class="btn" href="account-info.html">🏦 Account Information</a></div>
 <div class="grid">
  <div class="card"><h3>💸 Send Money</h3><p class="muted">Enter the receiver, amount and note. You will get a confirmation screen before the transfer.</p>
   <div class="field"><label>Receiver MATS Number</label><input id="receiver" maxlength="4" inputmode="numeric" placeholder="e.g. 4821"></div>
   <div class="field"><label>Amount</label><input id="sendAmount" type="number" min="1" step="0.01" placeholder="₹"></div>
   <div class="field"><label>Note (optional)</label><input id="note" maxlength="80" placeholder="Payment note"></div>
   <button class="btn btn-blue" id="continueSend">Continue</button><div id="sendMsg"></div><div id="confirmBox" class="confirm-box hidden"></div>
  </div>
  <div class="card"><h3>💳 MBS Virtual Card</h3>${vc.number?`<div class="card-visual"><div class="cv-top"><b>MBS</b><span>VIRTUAL CARD</span></div><div class="card-number">${esc(vc.number)}</div><div class="cv-bottom"><div><div class="cv-small">Card Holder</div><b>${esc(vc.name||u.name)}</b></div><div><div class="cv-small">Expiry</div><b>${esc(vc.expiry||"—")}</b></div><div><div class="cv-small">CVV</div><b>${esc(vc.cvv||"—")}</b></div></div></div>`:`<div class="notice">Your virtual card details have not been issued by the admin yet.</div>`}</div>
 </div>
 <br><div class="grid">
  <div class="card"><h3>🔐 Change MPIN</h3><p class="muted">Verify your current MPIN and set a new 4-digit MPIN.</p><div class="field"><label>Current MPIN</label><input id="oldMpin" type="password" maxlength="4" inputmode="numeric"></div><div class="field"><label>New MPIN</label><input id="newMpin" type="password" maxlength="4" inputmode="numeric"></div><div class="field"><label>Confirm New MPIN</label><input id="confirmMpin" type="password" maxlength="4" inputmode="numeric"></div><button class="btn btn-blue" id="changeMpin">Change MPIN</button><div id="mpinMsg"></div></div>
  <div class="card"><h3>📄 Account Statement</h3><p class="muted">Generate a proper PDF statement containing your account details and transaction history.</p><button class="btn btn-blue" id="downloadPdf">Download PDF Statement</button><div id="statementMsg"></div></div>
 </div>
 <br><div class="card"><h3>Transaction History</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Transaction ID</th><th>Type</th><th>Details</th><th>Amount</th></tr></thead><tbody id="history"></tbody></table></div></div>`;
 document.getElementById("continueSend").onclick=prepareTransfer;document.getElementById("changeMpin").onclick=changeMPIN;document.getElementById("downloadPdf").onclick=downloadPDF;logoutLink.onclick=e=>{e.preventDefault();logout()};
}
function validPin(v){return /^\d{4}$/.test(v)}
async function hashMPIN(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function prepareTransfer(){
 const mats=document.getElementById("receiver").value.trim(),amount=Math.round(Number(document.getElementById("sendAmount").value)*100)/100,memo=document.getElementById("note").value.trim(),box=document.getElementById("confirmBox"),msg=document.getElementById("sendMsg");
 if(!/^\d{4}$/.test(mats)){msg.innerHTML='<div class="notice danger">Enter a valid 4-digit receiver MATS Number.</div>';return}if(!Number.isFinite(amount)||amount<=0){msg.innerHTML='<div class="notice danger">Enter a valid amount greater than ₹0.</div>';return}if(amount>Number(u.balance||0)){msg.innerHTML='<div class="notice danger">Insufficient balance.</div>';return}if(mats===String(u.matsNumber)){msg.innerHTML='<div class="notice danger">You cannot send money to your own account.</div>';return}
 try{msg.innerHTML='<div class="notice">Finding receiver…</div>';const rs=await getDocs(query(collection(db,"accounts"),where("matsNumber","==",mats)));if(rs.empty)throw new Error("RECEIVER_NOT_FOUND");if(rs.size>1)throw new Error("DUPLICATE_MATS");const r=rs.docs[0].data();if(r.status!=="Approved")throw new Error("RECEIVER_NOT_APPROVED");
 box.classList.remove("hidden");box.innerHTML=`<h4>Confirm Transfer</h4><p>Send <b>${money(amount)}</b> to <b>${esc(r.name||"Customer")}</b> (MATS ${esc(mats)})?</p>${memo?`<p>Note: ${esc(memo)}</p>`:""}<div class="buttons"><button class="btn btn-blue" id="confirmTransfer">Confirm & Send</button><button class="btn" id="cancelTransfer">Cancel</button></div>`;document.getElementById("cancelTransfer").onclick=()=>box.classList.add("hidden");document.getElementById("confirmTransfer").onclick=()=>sendMoney(mats,amount,memo,box);
 }catch(e){const map={RECEIVER_NOT_FOUND:"Receiver account was not found.",DUPLICATE_MATS:"This MATS Number is duplicated.",RECEIVER_NOT_APPROVED:"Receiver account is not approved yet."};msg.innerHTML='<div class="notice danger">'+(map[e.message]||"Could not prepare transfer.")+'</div>'}
}
function makeTransactionId(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `MPS${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${Math.floor(1000+Math.random()*9000)}`}
async function sendMoney(mats,amount,memo,box){const msg=document.getElementById("sendMsg"),btn=document.getElementById("confirmTransfer");btn.disabled=true;btn.textContent="Processing…";try{const rs=await getDocs(query(collection(db,"accounts"),where("matsNumber","==",mats)));if(rs.empty)throw new Error("RECEIVER_NOT_FOUND");const receiverId=rs.docs[0].id;const transactionId=makeTransactionId();await runTransaction(db,async tx=>{const senderRef=doc(db,"accounts",u.id),receiverRef=doc(db,"accounts",receiverId),ss=await tx.get(senderRef),rsnap=await tx.get(receiverRef);if(!ss.exists()||!rsnap.exists())throw new Error("ACCOUNT_MISSING");const sender=ss.data(),receiver=rsnap.data(),sb=Number(sender.balance||0),rb=Number(receiver.balance||0);if(sender.status!=="Approved"||receiver.status!=="Approved")throw new Error("NOT_APPROVED");if(sb<amount)throw new Error("INSUFFICIENT");tx.update(senderRef,{balance:sb-amount});tx.update(receiverRef,{balance:rb+amount});tx.set(doc(collection(db,"transactions")),{transactionId,type:"Transfer",fromAccountId:u.id,fromMatsNumber:String(sender.matsNumber),fromName:String(sender.name),toAccountId:receiverId,toMatsNumber:String(receiver.matsNumber),toName:String(receiver.name),amount,note:memo,createdAt:serverTimestamp()})});msg.innerHTML=`<div class="notice success">${money(amount)} sent successfully.<br>Transaction ID: <b>${transactionId}</b></div>`;box.classList.add("hidden");document.getElementById("receiver").value="";document.getElementById("sendAmount").value="";document.getElementById("note").value="";await load()}catch(e){const map={INSUFFICIENT:"Insufficient balance.",NOT_APPROVED:"Account is not approved.",ACCOUNT_MISSING:"Account could not be found.","permission-denied":"Firebase permission denied."};msg.innerHTML='<div class="notice danger">'+(map[e.code]||map[e.message]||"Transfer failed. Please try again.")+'</div>';btn.disabled=false;btn.textContent="Confirm & Send"}}
async function changeMPIN(){const old=document.getElementById("oldMpin").value,newP=document.getElementById("newMpin").value,conf=document.getElementById("confirmMpin").value,msg=document.getElementById("mpinMsg");if(!validPin(old)||!validPin(newP)||!validPin(conf)){msg.innerHTML='<div class="notice danger">All MPINs must be exactly 4 digits.</div>';return}if(newP!==conf){msg.innerHTML='<div class="notice danger">New MPINs do not match.</div>';return}try{if(await hashMPIN(old)!==u.mpinHash)throw new Error("WRONG");const mpinHash=await hashMPIN(newP);await updateDoc(doc(db,"accounts",u.id),{mpinHash,mpinSetAt:new Date()});u.mpinHash=mpinHash;localStorage.setItem("mbsUser",JSON.stringify(u));msg.innerHTML='<div class="notice success">MPIN changed successfully.</div>';document.getElementById("oldMpin").value="";document.getElementById("newMpin").value="";document.getElementById("confirmMpin").value=""}catch(e){msg.innerHTML='<div class="notice danger">'+(e.message==="WRONG"?"Current MPIN is incorrect.":"Could not change MPIN.")+'</div>'}}
let currentTransactions=[];
async function loadHistory(){try{const s=await getDocs(collection(db,"transactions"));currentTransactions=s.docs.map(x=>({id:x.id,...x.data()})).filter(t=>t.accountId===u.id||t.fromAccountId===u.id||t.toAccountId===u.id).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));const el=document.getElementById("history");el.innerHTML=currentTransactions.map(t=>{const out=t.type==="Transfer"&&t.fromAccountId===u.id,inc=t.type==="Transfer"&&t.toAccountId===u.id,label=out?"Sent to "+esc(t.toMatsNumber):inc?"Received from "+esc(t.fromMatsNumber):t.type==="Admin Adjustment"?"Admin balance adjustment":"Transaction",sign=out?"−":inc?"+":t.type==="Admin Adjustment"?(Number(t.amount||0)>=0?"+":"−"):"";return `<tr><td>${t.createdAt?.toDate?t.createdAt.toDate().toLocaleString():"Just now"}</td><td class="small">${esc(t.transactionId||t.id)}</td><td>${esc(t.type||"Transaction")}</td><td>${label}${t.note?" · "+esc(t.note):t.reason?" · "+esc(t.reason):""}</td><td><b>${sign}${money(Math.abs(Number(t.amount||0)))}</b></td></tr>`}).join("")||'<tr><td colspan="5">No transactions yet.</td></tr>'}catch(e){document.getElementById("history").innerHTML='<tr><td colspan="5">Transaction history unavailable.</td></tr>'}}
function pdfEscape(v){return String(v??"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g," ")}
function buildSimplePDF(lines){
 const pageH=792,pageW=612,margin=40,lineH=14,maxLines=50,pages=[];
 for(let i=0;i<lines.length;i+=maxLines)pages.push(lines.slice(i,i+maxLines));
 const objs=[]; const add=x=>{objs.push(x);return objs.length};
 const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
 const pageIds=[]; const contentIds=[];
 pages.forEach(pg=>{let content='BT /F1 10 Tf '+margin+' '+(pageH-margin)+' Td ';pg.forEach((line,idx)=>{if(idx)content+='0 -'+lineH+' Td ';content+='('+pdfEscape(line.slice(0,105))+') Tj ';});content+='ET';const cid=add(`<< /Length ${content.length} >>\\nstream\\n${content}\\nendstream`);contentIds.push(cid);pageIds.push(0)});
 const pagesId=add(''); const pageObjs=[]; pages.forEach((_,i)=>{pageObjs.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${contentIds[i]} 0 R >>`))});
 objs[pagesId-1]=`<< /Type /Pages /Kids [${pageObjs.map(x=>x+' 0 R').join(' ')}] /Count ${pageObjs.length} >>`;
 const catalog=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
 let pdf='%PDF-1.4\n',offsets=[0]; for(let i=0;i<objs.length;i++){offsets[i+1]=pdf.length;pdf+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'} const xref=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<=objs.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([pdf],{type:'application/pdf'});
}
async function downloadPDF(){const msg=document.getElementById("statementMsg");try{if(!currentTransactions.length)await loadHistory();const lines=[];lines.push('MBS - ACCOUNT STATEMENT','Educational / demo statement','',`Customer: ${u.name||''}`,`Account Number: ${u.accountNumber||''}`,`MATS Number: ${u.matsNumber||''}`,`Current Balance: ${money(u.balance)}`,'','Date | Transaction ID | Type | Details | Amount','--------------------------------------------------------------------------------');currentTransactions.forEach(t=>{const date=t.createdAt?.toDate?t.createdAt.toDate().toLocaleString():'Just now';const details=t.type==='Transfer'?(t.fromAccountId===u.id?'Sent to ':'Received from ')+(t.toMatsNumber||t.fromMatsNumber||''):t.reason||t.type||'';const sign=t.fromAccountId===u.id?'−':t.toAccountId===u.id?'+':Number(t.amount||0)>=0?'+':'−';lines.push(`${date} | ${t.transactionId||t.id} | ${t.type||''} | ${details} | ${sign}${money(Math.abs(Number(t.amount||0)))}`);});const blob=buildSimplePDF(lines),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`MBS-Statement-${u.matsNumber}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);msg.innerHTML='<div class="notice success">PDF statement downloaded successfully.</div>'}catch(e){console.error(e);msg.innerHTML='<div class="notice danger">Could not create PDF statement: '+esc(e?.message||'Unknown error')+'</div>'}}
</script></body></html>

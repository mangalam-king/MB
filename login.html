<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login — MBS</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="index.html"><span class="logo">M</span>MBS</a></nav></header><main class="container"><div class="section-title"><h2>Customer Login</h2><p class="muted">Use your MBS Number.</p></div><form id="loginForm" class="card form"><div class="field"><label>MBS Number</label><input id="mats" maxlength="4" inputmode="numeric" placeholder="e.g. 4821" required></div><div class="field"><label>Mobile Number</label><input id="mobile" type="tel" required></div><button class="btn btn-blue" type="submit">Login</button><div id="msg"></div></form></main><footer class="footer">MBS — Mats Banks</footer>
<script type="module">import {db,collection,getDocs,query,where} from "./firebase.js";import {setUser} from "./app.js";
loginForm.addEventListener("submit",async e=>{e.preventDefault();msg.innerHTML="Checking…";try{const q=query(collection(db,"accounts"),where("matsNumber","==",mats.value.trim()),where("mobile","==",mobile.value.trim()));const s=await getDocs(q);if(s.empty){msg.innerHTML='<div class="notice danger">Account not found or not approved.</div>';return}const d={id:s.docs[0].id,...s.docs[0].data()};setUser(d);location.href="dashboard.html"}catch(err){console.error(err);msg.innerHTML='<div class="notice danger">Login failed. Check Firebase setup.</div>'}})</script></body></html>
